# ============================================================
# frp 客户端配置 — 将 Windows 中转服务器暴露到公网
# ============================================================
#
# 需要先在 VPS 上运行 frp 服务端 (frps)
#
# 用法:
#   1. 下载 frp: https://github.com/fatedier/frp/releases
#   2. 解压到当前目录
#   3. 运行: frpc.exe -c frpc.ini
#
# ============================================================

[common]
# VPS 地址（frp 服务端运行在 VPS 上）
server_addr = 8.148.237.155
server_port = 7000
# token 与 frps 保持一致（VPS frps.toml 中 auth.token）
token = 48aa2b400f0a29b12002e94c2f6c061b141dffe7

# 中转服务器 HTTP 端口
[relay-http]
type = tcp
local_ip = 127.0.0.1
local_port = 3002
remote_port = 3002
