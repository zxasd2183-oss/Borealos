[package]
name = "aurora-installer"
version = "0.4.0"
description = "Aurora 自定义动画安装器"
edition = "2021"

[lib]
name = "aurora_installer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows 平台依赖：
#   - winapi：原生错误对话框（MessageBoxW），快捷方式创建回退路径
#   - winreg：注册表卸载信息读写
# 快捷方式主路径使用 PowerShell（经 std::process::Command 调用），符合规范允许的两种方式之一
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
] }
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
