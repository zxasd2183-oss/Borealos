<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d0a22"/>
      <stop offset="100%" stop-color="#14102e"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0.22" y1="0.82" x2="0.78" y2="0.82">
      <stop offset="0%" stop-color="#00ffd0"/>
      <stop offset="20%" stop-color="#00d4ff"/>
      <stop offset="40%" stop-color="#4080ff"/>
      <stop offset="55%" stop-color="#7060ff"/>
      <stop offset="70%" stop-color="#a040ff"/>
      <stop offset="85%" stop-color="#c830ff"/>
      <stop offset="100%" stop-color="#e020a0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0.35" y1="0" x2="0.65" y2="0">
      <stop offset="0%" stop-color="#3060ff"/>
      <stop offset="50%" stop-color="#6050ff"/>
      <stop offset="100%" stop-color="#9050ff"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sq">
      <rect x="0" y="0" width="1024" height="1024" rx="227" ry="227"/>
    </clipPath>
  </defs>
  
  <rect x="0" y="0" width="1024" height="1024" rx="227" ry="227" fill="url(#bgGrad)"/>
  
  <g clip-path="url(#sq)">
    <!-- A legs (thicker for better small-size visibility) -->
    <path d="M 256 819 L 512 204 L 768 819"
          stroke="url(#auroraGrad)" stroke-width="87" fill="none" 
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Crossbar (thicker, wider for visibility at all sizes) -->
    <line x1="353" y1="599" 
          x2="670" y2="599"
          stroke="url(#barGrad)" stroke-width="87" 
          stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>