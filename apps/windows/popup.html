<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; }
  html,body { background:transparent; font-family:"Segoe UI","Microsoft YaHei",-apple-system,"Helvetica Neue",sans-serif; }
  /* 头部可拖动悬浮窗（按钮除外） */
  .capsule { -webkit-app-region:drag; }
  .btns, .btns button, .head .sub { -webkit-app-region:no-drag; }
  body { padding:10px; }
  .capsule {
    border-radius:20px; padding:14px 14px 12px;
    background:rgba(18,18,23,.86);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 16px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(26px) saturate(1.25); -webkit-backdrop-filter:blur(26px) saturate(1.25);
    color:#f2f2f7;
    animation:drop .26s cubic-bezier(.32,1.4,.5,1);
  }
  @keyframes drop { from { opacity:0; transform:translateY(-8px) scale(.97); } to { opacity:1; transform:none; } }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#34d399; box-shadow:0 0 8px rgba(52,211,153,.7); transition:background .3s; }
  .dot.off { background:#fbbf24; box-shadow:0 0 8px rgba(251,191,36,.7); }
  .dot.dead { background:#f87171; box-shadow:0 0 8px rgba(248,113,113,.7); }
  .title { font-size:13px; font-weight:700; letter-spacing:.02em; }
  .sub { font-size:10.5px; color:rgba(255,255,255,.42); margin-left:auto; font-variant-numeric:tabular-nums; }

  /* 分组卡（iOS 风格） */
  .sec-card {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07);
    border-radius:14px; padding:9px 11px; margin-top:10px;
  }
  .sec { font-size:10px; font-weight:600; color:rgba(255,255,255,.38); letter-spacing:.06em; margin-bottom:5px; }
  .sec .right { float:right; font-weight:500; color:rgba(255,255,255,.3); }

  /* 任务行 */
  .task { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; }
  .task .tname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#e8e8ed; }
  .badge { flex:0 0 auto; font-size:10px; font-weight:600; padding:2px 8px; border-radius:99px; letter-spacing:.02em; }
  .badge.running { background:rgba(94,92,230,.22); color:#a5b4fc; animation:pulse 1.6s ease-in-out infinite; }
  .badge.pending { background:rgba(255,255,255,.08); color:rgba(255,255,255,.45); }
  .badge.done { background:rgba(52,211,153,.13); color:#34d399; }
  .badge.failed { background:rgba(248,113,113,.15); color:#f87171; }
  .badge.ok { background:rgba(52,211,153,.13); color:#34d399; }
  .badge.warn { background:rgba(251,191,36,.13); color:#fbbf24; }
  .badge.bad { background:rgba(248,113,113,.15); color:#f87171; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }

  /* 限额圆环仪表（watchOS 风格同心环，与主站灵动岛同款） */
  .prow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:3px 0 1px; }
  .prow .badge { flex-shrink:0; }
  .pname { font-size:12.5px; font-weight:600; color:#ececf2; }
  .ring-wrap { display:flex; gap:12px; align-items:center; padding:6px 0 4px; }
  .ring { flex:none; width:56px; height:56px; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-linecap:round; transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1); }
  .ring .track { stroke:rgba(255,255,255,.09); }
  .ring-box { position:relative; width:56px; height:56px; flex:none; }
  .ring-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#f2f2f7; font-variant-numeric:tabular-nums; }
  .ring-info { flex:1; min-width:0; }
  .ring-win { display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,.55); padding:1.5px 0; }
  .ring-win b { font-variant-numeric:tabular-nums; font-weight:600; }
  .ring-reset { font-size:10px; color:rgba(255,255,255,.32); margin-top:1px; }
  .ring-note { font-size:11px; color:rgba(255,255,255,.55); padding:2px 0; }

  /* Token 用量条 */
  .urow { padding:3px 0; }
  .uname { display:flex; justify-content:space-between; font-size:11.5px; color:#d8d8e0; padding-bottom:3px; }
  .uname b { font-variant-numeric:tabular-nums; font-weight:600; color:#f2f2f7; }
  .ubar { height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
  .ubar > i { display:block; height:100%; border-radius:2px; background:linear-gradient(90deg,#5e5ce6,#a78bfa); transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .grand { display:flex; justify-content:space-between; font-size:11px; font-weight:600; color:rgba(255,255,255,.5); padding-top:7px; margin-top:5px; border-top:1px solid rgba(255,255,255,.07); }

  .empty { font-size:12px; color:rgba(255,255,255,.4); text-align:center; padding:16px 0 8px; line-height:1.7; }

  /* 按钮 */
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns button {
    flex:1; border:1px solid rgba(139,92,246,.35); border-radius:12px; padding:8px 0; font-size:12px; font-weight:600;
    background:rgba(139,92,246,.16); color:#c4b5fd; cursor:pointer; transition:transform .15s,background .15s;
    font-family:inherit;
  }
  .btns button:hover { background:rgba(139,92,246,.28); transform:translateY(-1px); }
  .btns button:active { transform:scale(.97); }
  .btns button.gray { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.1); color:rgba(255,255,255,.55); }
  .btns button.gray:hover { background:rgba(255,255,255,.1); }
</style>
</head>
<body>
<div class="capsule">
  <div class="head">
    <div class="dot off" id="dot"></div>
    <div class="title">Borealos <span style="font-weight:400;opacity:.4;font-size:10px">v5.1.2</span></div>
    <div class="sub" id="hint">连接中…</div>
  </div>
  <div id="body">
    <div class="empty">正在读取状态…</div>
  </div>
  <div class="btns">
    <button onclick="bar.action('show-main')">主窗口</button>
    <button onclick="bar.action('open-site')" class="gray">官网</button>
    <button onclick="bar.action('quit')" class="gray">退出</button>
  </div>
</div>
<script>
  const dot = document.getElementById('dot');
  const hint = document.getElementById('hint');
  const body = document.getElementById('body');
  function fmt(n){ if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); }
  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function at(ts){ if(!ts) return ''; const d=new Date(ts); return '更新于 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  const ringColor = p => p >= 90 ? '#f87171' : p >= 70 ? '#fbbf24' : '#8b5cf6';
  const ringColor2 = p => p >= 90 ? '#fca5a5' : p >= 70 ? '#fcd34d' : '#5e5ce6';
  function fmtReset(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return (d.getMonth()+1)+'/'+d.getDate()+' 重置'; }

  /* 单个供应商：徽章 + 同心环（外圈=窗口一，内圈=窗口二，中心=最高用量） */
  function providerHtml(p){
    const ws = (p.windows||[]).filter(w => typeof w.usedPercent === 'number');
    let badge, bcls;
    if(p.error){
      if(/401|403/.test(p.error)){ badge='需重新登录'; bcls='bad'; }
      else if(/429/.test(p.error)){ badge='限流中'; bcls='warn'; }
      else { badge='查询失败'; bcls='bad'; }
    } else if(!ws.length){ badge='有效'; bcls='ok'; }
    else {
      const mx = Math.max.apply(null, ws.map(w => w.usedPercent||0));
      badge = p.plan || '正常';
      bcls = mx >= 90 ? 'bad' : mx >= 70 ? 'warn' : 'ok';
    }
    let html = '<div class="prow"><span class="pname">'+esc(p.name)+'</span>'+
      '<span class="badge '+bcls+'">'+esc(badge)+'</span></div>';
    if(p.error || !ws.length){
      const msg = p.error
        ? (/401|403/.test(p.error) ? '凭据已过期，重新登录后恢复' : '暂时查询失败，稍后自动重试')
        : (p.note || '订阅有效');
      html += '<div class="ring-wrap"><div class="ring-box"><svg class="ring" viewBox="0 0 62 62">'+
        '<circle class="track" cx="31" cy="31" r="26" stroke-width="6"/></svg>'+
        '<span class="ring-pct" style="color:'+(p.error?'#f87171':'#34d399')+';font-size:15px">'+(p.error?'!':'✓')+'</span></div>'+
        '<div class="ring-info"><div class="ring-note">'+esc(msg)+'</div></div></div>';
      return html;
    }
    const w0 = ws[0], w1 = ws[1] || null;
    const p0 = Math.round(w0.usedPercent||0), p1 = w1 ? Math.round(w1.usedPercent||0) : null;
    const C0 = 2*Math.PI*26, C1 = 2*Math.PI*18;
    let svg = '<div class="ring-box"><svg class="ring" viewBox="0 0 62 62">'+
      '<circle class="track" cx="31" cy="31" r="26" stroke-width="6"/>'+
      '<circle cx="31" cy="31" r="26" stroke-width="6" stroke="'+ringColor(p0)+'" stroke-dasharray="'+C0.toFixed(1)+'" stroke-dashoffset="'+(C0*(1-p0/100)).toFixed(1)+'"/>';
    if(w1) svg += '<circle class="track" cx="31" cy="31" r="18" stroke-width="6"/>'+
      '<circle cx="31" cy="31" r="18" stroke-width="6" stroke="'+ringColor2(p1)+'" stroke-dasharray="'+C1.toFixed(1)+'" stroke-dashoffset="'+(C1*(1-p1/100)).toFixed(1)+'"/>';
    svg += '</svg><span class="ring-pct">'+Math.max(p0, p1||0)+'%</span></div>';
    let info = '<div class="ring-info">';
    const winLine = (w, p) => {
      const lbl = (w.label || '窗口').replace(/（\d+% 已用）/, '');
      return '<div class="ring-win"><span>'+esc(lbl)+'</span><b style="color:'+ringColor(p)+'">'+p+'%</b></div>'+
        (w.resetAt ? '<div class="ring-reset">'+fmtReset(w.resetAt)+'</div>' : '');
    };
    info += winLine(w0, p0);
    if(w1) info += winLine(w1, p1);
    info += '</div>';
    return html + '<div class="ring-wrap">'+svg+info+'</div>';
  }

  function render(d){
    // 网关完全不可达
    if(!d || !d.ok){
      dot.className = 'dot dead'; hint.textContent = '离线';
      body.innerHTML = '<div class="empty">网关不可达<br>胶囊保持待命，恢复后自动变绿</div>';
      return;
    }
    // 网关通但没登录态
    if(!d.authed){
      dot.className = 'dot off'; hint.textContent = '未登录';
      body.innerHTML = '<div class="empty">尚未登录<br>打开主窗口登录后，这里自动出数据</div>';
      return;
    }
    // 已登录，网关健康状态
    const online = d.online !== false;
    dot.className = online ? 'dot' : 'dot off';
    hint.textContent = (online ? '在线' : '网关异常') + (d.at ? ' · ' + at(d.at).slice(3) : '');
    const tasks = Array.isArray(d.tasks) ? d.tasks : [];
    const models = (d.usage && d.usage.models) || [];
    const grand = (d.usage && d.usage.grand) || null;
    const providers = (d.quota && d.quota.providers) || [];
    let html = '';
    // 进行中/最近任务
    if(tasks.length){
      const label = { running:'运行中', pending:'排队中', done:'已完成', failed:'失败' };
      html += '<div class="sec-card"><div class="sec">任务</div>';
      for(const t of tasks.slice(0,4)){
        const st = label[t.status] ? t.status : 'pending';
        html += '<div class="task"><span class="tname">'+esc(t.title||t.text||t.id)+'</span>'+
          '<span class="badge '+st+'">'+label[st]+'</span></div>';
      }
      html += '</div>';
    }
    // 订阅限额（官方接口，与 CLI /usage 同源）
    if(providers.length){
      html += '<div class="sec-card"><div class="sec">订阅限额'+(d.at?'<span class="right">'+at(d.at).slice(3)+'</span>':'')+'</div>';
      for(const p of providers) html += providerHtml(p);
      html += '</div>';
    }
    // Token 用量
    if(models.length){
      const max = Math.max.apply(null, models.map(m => m.total||0).concat([1]));
      html += '<div class="sec-card"><div class="sec">Token 用量</div>';
      for(const m of models.slice(0,5)){
        const w = Math.max(2, Math.round((m.total||0)/max*100));
        html += '<div class="urow"><div class="uname"><span>'+esc(m.model)+'</span><b>'+fmt(m.total||0)+'</b></div>'+
          '<div class="ubar"><i style="width:'+w+'%"></i></div></div>';
      }
      if(grand) html += '<div class="grand"><span>合计</span><span>'+fmt(grand.total||0)+' tokens · '+grand.calls+' 次</span></div>';
      html += '</div>';
    }
    if(!html) html = '<div class="empty">暂无数据</div>';
    body.innerHTML = html;
  }
  bar.onStatus(render);
</script>
</body>
</html>
