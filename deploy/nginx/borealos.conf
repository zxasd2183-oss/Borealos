# ============================================================
# BorealOS Nginx 反向代理配置
# ============================================================
# 用法：
#   sudo cp deploy/nginx/borealos.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/borealos.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# 后端 API + WebSocket
upstream borealos_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Rust AI 网关
upstream borealos_gateway {
    server 127.0.0.1:8787;
    keepalive 16;
}

# ---- HTTP → HTTPS 重定向 ----
server {
    listen 80;
    listen [::]:80;
    server_name borealos.dev *.borealos.dev;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Web IDE (ide.borealos.dev) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ide.borealos.dev;

    # SSL 证书（如使用 Cloudflare Tunnel 则不需要）
    # ssl_certificate /etc/letsencrypt/live/borealos.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/borealos.dev/privkey.pem;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 前端静态文件由后端 Fastify 提供
    location / {
        proxy_pass http://borealos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket 网关
    location /ws {
        proxy_pass http://borealos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ---- API (api.borealos.dev) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.borealos.dev;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API 请求
    location / {
        proxy_pass http://borealos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 限流
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://borealos_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---- AI 网关 (gw.borealos.dev) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gw.borealos.dev;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://borealos_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}

# ---- 限流区域定义（放在 nginx.conf 的 http 块中）----
