version: '1.0'
name: build-frontend
displayName: 构建前端 (Web)

triggers:
  push:
    branches:
      precise:
        - master
  schedule: []

stages:
  - stage: build
    displayName: 前端构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_web
        displayName: 构建 Web 应用
        nodeVersion: 20
        commands:
          - npm install -g pnpm
          - pnpm install --frozen-lockfile
          - pnpm --filter @borealos/web build
        artifacts:
          - name: WEB_DIST
            path:
              - ./apps/web/dist
